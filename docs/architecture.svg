<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img"
  aria-labelledby="architecture-title architecture-desc"
  font-family="'Geist', 'Inter', 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <title id="architecture-title">璺道插件仓库：从 submodule 到会话 skill 目录</title>
  <desc id="architecture-desc">架构图：两处上游 skill 仓库经同步脚本的两道校验 vendor 成本地 skills/，再由纯配置 bundle 挂载官方 dsh-skill-filesystem
    的隔离实例，注册进会话 skill 目录，供模型自动取用与人用斜杠唤起。</desc>

  <defs>
    <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
    </marker>
    <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0EA5E9" />
    </marker>
    <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0D9488" />
    </marker>
  </defs>

  <!-- paper -->
  <rect width="100%" height="100%" fill="#f5f5f5" />

  <!-- eyebrow + title -->
  <text x="40" y="52" fill="#4f5d75" font-size="8"
    font-family="'Geist Mono', 'SFMono-Regular', 'Cascadia Mono', Consolas, monospace"
    letter-spacing="0.18em">ARCHITECTURE · DSH-PLUGIN-WENDAO</text>
  <text x="40" y="84" fill="#2d3142" font-size="28"
    font-family="'Instrument Serif', Georgia, 'Songti SC', 'Noto Serif SC', 'SimSun', serif">璺道插件仓库：从 submodule 到会话
    skill 目录</text>

  <!-- ============ arrows (drawn before boxes) ============ -->
  <!-- 01 vendor 上游 -->
  <line x1="384" y1="156" x2="468" y2="156" stroke="#0D9488" stroke-width="1.2"
    marker-end="url(#architecture-arrow-link)" />
  <line x1="812" y1="156" x2="896" y2="156" stroke="#0EA5E9" stroke-width="1.4"
    marker-end="url(#architecture-arrow-accent)" />
  <!-- 01 → 02 行转折 -->
  <line x1="1068" y1="196" x2="1068" y2="264" stroke="#4f5d75" stroke-width="1.2"
    marker-end="url(#architecture-arrow)" />
  <!-- 02 打包 → 分发 → 挂载（本行自右向左） -->
  <line x1="896" y1="304" x2="812" y2="304" stroke="#0D9488" stroke-width="1.2"
    marker-end="url(#architecture-arrow-link)" />
  <line x1="468" y1="304" x2="384" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)" />
  <!-- 02 → 03 行转折 -->
  <line x1="212" y1="344" x2="212" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)" />
  <!-- 03 目录 → 两个入口 -->
  <line x1="384" y1="436" x2="468" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)" />
  <path d="M 384,460 H 418 Q 426,460 426,468 V 524 Q 426,532 434,532 H 468" fill="none" stroke="#4f5d75"
    stroke-width="1.2" marker-end="url(#architecture-arrow)" />

